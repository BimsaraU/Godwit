[project]
name = "godwit-contracts"
version = "0.1.0"
description = "Shared Pydantic contracts, taint types and protocols. Depends on nothing."
readme = "HANDOFF.md"
requires-python = ">=3.12,<3.13"
dependencies = ["pydantic>=2.7"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godwit_contracts"]
