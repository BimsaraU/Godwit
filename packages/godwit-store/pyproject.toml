[project]
name = "godwit-store"
version = "0.1.0"
description = "Postgres + pgvector persistence for patterns, runs and audit (L5)."
readme = "HANDOFF.md"
requires-python = ">=3.12,<3.13"
dependencies = ["godwit-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godwit_store"]
