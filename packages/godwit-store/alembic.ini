# Alembic configuration for godwit-store.
#
#   uv run alembic -c packages/godwit-store/alembic.ini upgrade head
#
# The database URL is NOT stored here. It is read from GODWIT_STORE_URL by
# migrations/env.py, because a connection string in a file in the repository is a
# credential in the repository, and the contracts already say secrets are never
# plaintext at rest.

[alembic]
# %(here)s is this file's directory, so the command works from any cwd.
script_location = %(here)s/src/godwit_store/migrations
prepend_sys_path = %(here)s/src
path_separator = os
timezone = UTC

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
