[project]
name = "godwit-probe"
version = "0.1.0"
description = "Probe workers executing a ProbeSpec into a SketchBundle (L1)."
readme = "HANDOFF.md"
requires-python = ">=3.12,<3.13"
dependencies = ["godwit-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godwit_probe"]
