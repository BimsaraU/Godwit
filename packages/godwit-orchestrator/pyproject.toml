[project]
name = "godwit-orchestrator"
version = "0.1.0"
description = "Belief state and budgeted bandit allocation over the probe space (L4)."
readme = "HANDOFF.md"
requires-python = ">=3.12,<3.13"
dependencies = ["godwit-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godwit_orchestrator"]
