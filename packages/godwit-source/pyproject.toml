[project]
name = "godwit-source"
version = "0.1.0"
description = "GODWIT A1 -- source adapters and L-1 metadata detectors (data plane)"
requires-python = ">=3.12"
dependencies = [
    "pyarrow>=16",
]

[project.optional-dependencies]
iceberg = ["pyiceberg>=0.7"]
postgres = ["psycopg[binary]>=3.1"]
dev = ["pytest>=8", "hypothesis>=6", "ruff>=0.5", "mypy>=1.10"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godwit_source"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ANN", "RUF"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["pyiceberg.*", "psycopg.*", "pyarrow.*"]
ignore_missing_imports = true

# godwit-contracts (A0) does not exist yet; tests/test_contracts_gap.py imports it to prove
# that. Remove this block when A0 lands. See docs/change-requests/CR-A1-contracts-missing.md.
[[tool.mypy.overrides]]
module = ["godwit_contracts.*", "godwit_contracts"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
