[project]
name = "godwit-source"
version = "0.1.0"
description = "Source adapters and the semantic catalog (L-1, L0)."
readme = "HANDOFF.md"
requires-python = ">=3.12,<3.13"
dependencies = ["godwit-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godwit_source"]
