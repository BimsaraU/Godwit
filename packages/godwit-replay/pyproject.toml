[project]
name = "godwit-replay"
version = "0.1.0"
description = "Deterministic replay of a probe/detector run from lineage (invariant 7)."
readme = "HANDOFF.md"
requires-python = ">=3.12,<3.13"
dependencies = ["godwit-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godwit_replay"]
