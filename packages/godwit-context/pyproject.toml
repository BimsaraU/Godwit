[project]
name = "godwit-context"
version = "0.1.0"
description = "Explained-away layer: deploys, campaigns, holidays, DQ failures (L3)."
readme = "HANDOFF.md"
requires-python = ">=3.12,<3.13"
dependencies = ["godwit-contracts"]

[build-system]
requires = ["hatchling"]
