[project]
name = "godwit-sdk"
version = "0.1.0"
description = "Public extension surface for third-party probes and detectors (SDK)."
readme = "HANDOFF.md"
requires-python = ">=3.12,<3.13"
dependencies = ["godwit-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godwit_sdk"]
