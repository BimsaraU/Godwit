[project]
name = "godwit-guard"
version = "0.1.0"
description = "Classification, redaction, tokenisation and the egress gate (GATE)."
readme = "HANDOFF.md"
requires-python = ">=3.12,<3.13"
dependencies = ["godwit-contracts"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/godwit_guard"]
